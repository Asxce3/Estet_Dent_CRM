<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Upload</title>
    <style>
        .drop-zone {
            width: 300px;
            height: 150px;
            border: 2px dashed #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            cursor: pointer;
            margin: 20px auto;
        }
        .drop-zone.dragover {
            background-color: #f0f0f0;
        }
        #file-list {
            margin-top: 20px;
            text-align: center;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:disabled {
            background: #aaa;
        }
        #upload-form {
            display: flex;
            flex-direction: column;
        }
    </style>

</head>
<body>

<form action="/med_card/document/upload" id="upload-form" method="post" enctype="multipart/form-data" th:object="${test}">
    <input type="file" name="files[]" onchange="addFileInput(this)">
    <button type="submit">Отправить</button>
</form>
<script>
    function addFileInput(input) {
        if (input.files.length > 0) {
            // Проверяем, является ли последний input заполненным
            const form = document.getElementById("upload-form");
            const inputs = form.querySelectorAll('input[type="file"]');
            const lastInput = inputs[inputs.length - 1];

            if (lastInput === input) { // Если это последний input, добавляем новый
                const newInput = document.createElement("input");
                newInput.type = "file";
                newInput.name = "files[]";
                newInput.onchange = function() { addFileInput(this); };
                form.appendChild(newInput);
            }
        }
    }
</script>

</body>
</html>
