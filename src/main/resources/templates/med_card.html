<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта лечения пациента</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        a {
            text-decoration: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 70%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #patient-info label {
            display: block;
            margin-top: 10px;
        }

        #patient-info input,
        #medical-info input,
        #medical-info textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn {
            background-color: #008CBA;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .card {
            display: flex;
            /*justify-content: space-between;*/
        }


        .bar input,
        .bar label,
        .bar textarea{
            margin: 0 20px;
        }

        .right-sidebar {
            border: 1px solid #ddd;
            width: 45%;
        }


        #medical-info {
            margin-top: 30px;
            margin-right: 20%;
        }



        .patient_bar {
            align-items: center;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        #patient-info {
            width: 30%;
        }

        .btn_container {
            margin-top: 5%;
            display: flex;
            justify-content: space-between;
        }

        .teeth_container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .teeth {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
            /*height: 40%; !* Половина высоты *!*/
        }

        /* Размещение в четвертях */
        .teeth:nth-child(1) { align-self: flex-start; } /* Верхний левый */
        .teeth:nth-child(2) { align-self: flex-start; } /* Верхний правый */
        .teeth:nth-child(3) { align-self: flex-end; } /* Нижний левый */
        .teeth:nth-child(4) { align-self: flex-end; } /* Нижний правый */

        .teeth img {
            cursor: pointer; /* Курсор в виде указателя */
            margin: 0 auto;
            width: 50px;
            height: auto;
        }

        .teeth img.clicked {
            background-color: rgba(167, 35, 163, 0.5);
            background-blend-mode: multiply;
        }

        .teeth:nth-child(4) { grid-column: 2; grid-row: 2; } /* Нижний правый */

        ul {
            list-style-type: none;
            padding-left: 20px;
        }
        .folder {
            font-weight: bold;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
        li { font-weight: normal; cursor: pointer; }
    </style>
</head>
<body>
<form class="container" method="POST"  id="upload-form" enctype="multipart/form-data" th:action="@{/med_card}" th:object="${med_card}">
    <h1>Зубы пациента</h1>

        <div class="teeth 3">
            <img src="https://www.freeiconspng.com/thumbs/tooth-icon/dental-tooth-icon-12.png" alt="">

            <img src="https://www.freeiconspng.com/thumbs/tooth-icon/dental-tooth-icon-12.png" alt="">
        </div>
    </div>

    <div id="patient-info">
        <input type="hidden" th:field="*{visits}">
        <h1>Карта лечения пациента</h1>
        <div class="patient_bar">
            <label for="patient-name">Имя пациента:</label>
            <span id="patient-name" th:text="${med_card.visits.patient.name}">Вася Пупкин</span>
        </div>
        <div class="patient_bar">
            <label for="patient-birth-date">Дата рождения:</label>
            <span id="patient-birth-date" th:text="${med_card.visits.patient.birthDate}">03.12.2003</span>
        </div>
        <div class="patient_bar">
            <label for="patient-telephone">Номер телефона:</label>
            <span id="patient-telephone" th:text="${med_card.visits.patient.telephoneNumber}">+77019884492</span>
        </div>
    </div>
    <div class="card" >
        <div id="medical-info">
            <div class="bar">
                <label for="diagnosis">Диагноз:</label>
                <textarea type="text" id="diagnosis" placeholder="Введите диагноз" th:field="*{diagnosis}"></textarea>
            </div>

            <div class="bar">
                <label for="complaints">Жалобы:</label>
                <textarea id="complaints" placeholder="Введите жалобы" rows="2" th:field="*{complaints}"></textarea>
            </div>

            <div class="bar">
                <label for="anamnesis">Анамнез:</label>
                <textarea id="anamnesis" placeholder="Введите анамнез" rows="3" th:field="*{anamnesis}"></textarea>
            </div>

            <div class="bar">
                <label for="objective">Объективно:</label>
                <textarea id="objective" placeholder="Объективные данные" rows="3" th:field="*{objective}"></textarea>
            </div>

            <div class="bar">
                <label for="treatment">Лечение:</label>
                <textarea id="treatment" placeholder="Введите детали лечения" rows="4" th:field="*{treatment}"></textarea>
            </div>

            <div class="bar">
                <label for="recommendations">Рекомендации:</label>
                <textarea id="recommendations" placeholder="Введите рекомендации" rows="3" th:field="*{recommendations}"></textarea>
            </div>


            <div class="bar">
                <label for="allergies">Аллергические реакции:</label>
                <textarea type="text" id="allergies" placeholder="Введите информацию об аллергиях" th:field="*{allergies}"></textarea>

            </div>

            <div class="bar">
                <label for="botkin">Болезнь Боткина:</label>
                <textarea type="text" id="botkin" placeholder="Введите информацию о болезни Боткина" th:field="*{botkin}"></textarea>
            </div>
        </div>
        <div class="right-sidebar">
            <h2>Структура директорий</h2>
            <div id="tree"></div>

        </div>
    </div>

    <div class="btn_container">
        <a th:href="@{/patients/{id}(id=${med_card.visits.patient.ID})}" id="back-btn" class="btn"> Вернутся
        </a>
        <button id="save-btn" class="btn" type="submit">Сохранить карту</button>
    </div>
<!--    <input type="file" name="files[]" onchange="addFileInput(this)">-->
</form>

<script th:src="@{/js/med_card/Auto_filling_fields.js}"></script>

</body>
</html>
