<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обновление записи на прием</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-container {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 24px;
            color: #333;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }
        input, select, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3c7ade;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button, .create-patient-btn {
            background: #3c7ade;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            display: block;
        }
        button:hover, .create-patient-btn:hover {
            background: #2563eb;
        }
        .create-patient-btn {
            margin-bottom: 24px;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="https://code.jquery.com/jquery-2.2.4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.maskedinput/1.4.1/jquery.maskedinput.min.js"></script>
</head>
<body>

<div class="form-container">
    <h2>Обновление записи пациента: </h2>
    <div id="appointment-form">
        <input type="hidden" name="id" th:field="${visit.id}" id="visit_id"/>
        <div class="form-row">
            <div class="form-group">
                <label for="name">ФИО</label>
                <input type="text" id="name" name="name" required th:field="${patient.name}" >
            </div>

            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" required th:field="${patient.telephoneNumber}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="address">Адрес:</label>
                <input type="text" id="address" name="address" required  th:field="${patient.address}">
            </div>
            <div class="form-group">
                <label for="date_of_birth">Дата рождения:</label>
                <input type="date" id="date_of_birth" name="date_of_birth" required th:value="${patient.birthDate}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="date_of_visit">Дата приема:</label>
                <input type="date" id="date_of_visit" name="date_of_visit" required>
            </div>
            <div class="form-group">
                <label for="start_visit">Начало:</label>
                <input type="time" id="start_visit" name="start_visit" required>
            </div>

            <div class="form-group">
                <label for="finish_visit">Конец:</label>
                <input type="time" id="finish_visit" name="finis_visit" required>
            </div>
        </div>

        <div class="form-group">
            <label for="complaints">Мед история:</label>
            <input id="medHistory" name="medHistory" required th:field="${medHistory.name}">
        </div>

        <div class="form-group">
            <label for="complaints">Жалобы пациента:</label>
            <textarea id="complaints" name="complaints" rows="3" required th:field="${visit.complaint}"></textarea>
        </div>
        <button type="button" onclick="updateVisit()">Обновить запись</button>
    </div>

</div>
<script>
    const visitsUrl = '/visits'
    const visitId = document.getElementById('visit_id').value

    function formatPhoneNumber(phone) {
        const digits = phone.replace(/\D/g, '');
        const number = digits.slice(1);
        return `+7 (${number.slice(0, 3)}) ${number.slice(3, 6)}-${number.slice(6, 8)}-${number.slice(8, 10)}`;
    }

    let phone = document.getElementById('phone')
    phone.value = formatPhoneNumber(phone.value)

    async function updateVisit() {
        try {
            const json = getFields()
            const response = await fetch(`${visitsUrl}/${visitId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: json
            })
            if(!response.ok) {
                throw new Error(`Response status = ${response.status}`)
            }
            window.location.href = visitsUrl
        }   catch (error) {
            console.log(error)
        }
    }

    function getFields() {
        const date_of_visit = document.getElementById('date_of_visit').value
        const start_visit = document.getElementById('start_visit').value
        const finish_visit = document.getElementById('finish_visit').value

        return JSON.stringify({
            id: visitId,
            dateOfVisit : date_of_visit,
            startVisit : start_visit,
            finishVisit : finish_visit
        })
    }
</script>
</body>
</html>
