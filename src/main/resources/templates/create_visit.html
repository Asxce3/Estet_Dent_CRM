<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на прием</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .form-container {
            background: white;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        input, select, textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #218838;
        }
    </style>
    <script src="https://code.jquery.com/jquery-2.2.4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.maskedinput/1.4.1/jquery.maskedinput.min.js"></script>
    <script type="text/javascript" th:src="@{/js/create/MaskNumber.js}"></script>
    <script type="text/javascript" th:src="@{/js/create_visit/create_visit.js}"></script>
</head>
<body>
<table id="patients-table" border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>ФИО</th>
        <th>Дата рождения</th>
        <th>Телефон</th>
        <th>Адрес</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<div class="form-container">
    <h2>Содание записи</h2>
    <a href="/patients/create"><button type="button">Создать пациента</button></a>
    <form id="appointment-form">
        <div class="form-row">
            <div class="form-group">
                <label for="name">ФИО:</label>
                <input type="text" id="name" name="name" required oninput="checkLengthName()">
            </div>

            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="address">Адрес:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="date_of_birth">Дата рождения:</label>
                <input type="date" id="date_of_birth" name="date_of_birth" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="date_of_visit">Дата приема:</label>
                <input type="date" id="date_of_visit" name="date_of_visit" required>
            </div>
            <div class="form-group">
                <label for="start_visit">Начало:</label>
                <input type="time" id="start_visit" name="start_visit" required>
            </div>
            <div class="form-group">
                <label for="finis_visit">Конец:</label>
                <input type="time" id="finis_visit" name="finis_visit" required>
            </div>
        </div>

        <div class="form-group">
            <label for="complaints">Жалобы пациента:</label>
            <textarea id="complaints" name="complaints" rows="3" required></textarea>
        </div>

        <button type="submit" onclick="createTimeVisit()">Записаться</button>
    </form>
</div>
<script>
    async function createTimeVisit() {
        let date = document.getElementById("date_of_visit").value;
        const visits = {"date_of_visit": date}
        try {
            const response = await fetch("/visits", {
                method: "POST",
                body: JSON.stringify(visits)
            })
        }   catch (error) {
            console.log(error);
        }

    }
</script>
</body>
</html>
