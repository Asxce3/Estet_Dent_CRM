<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание записи на прием</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-container {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 24px;
            color: #333;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }
        input, select, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3c7ade;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button, .create-patient-btn {
            background: #3c7ade;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            display: block;
        }
        button:hover, .create-patient-btn:hover {
            background: #2563eb;
        }
        .create-patient-btn {
            margin-bottom: 24px;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>
<div class="form-container">
    <div th:if="${error_message}" style="color:red;">
        <p th:text="${error_message}"></p>
    </div>
    <h2>Создание записи</h2>
    <a href="/patients/create" class="create-patient-btn">Создать пациента</a>
    <form id="appointment-form" th:action="@{/visits}" th:object="${visit}" method="post">
        <div class="form-row">
            <div class="form-group">
                <label for="name">ФИО:</label>
                <input type="text" id="name" name="name" required oninput="checkLengthName()" list="patients-list">
                <datalist id="patients-list"></datalist>
            </div>
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="address">Адрес:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="date_of_birth">Дата рождения:</label>
                <input type="date" id="date_of_birth" name="date_of_birth" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="date_of_visit">Дата приема:</label>
                <input type="date" id="date_of_visit" name="date_of_visit" required th:field="*{dateOfVisit}">
            </div>
            <div class="form-group">
                <label for="start_visit">Начало:</label>
                <input type="time" id="start_visit" name="start_visit" required th:field="*{startVisit}">
            </div>
            <div class="form-group">
                <label for="finis_visit">Конец:</label>
                <input type="time" id="finis_visit" name="finis_visit" required th:field="*{finishVisit}">
            </div>
        </div>
        <div class="form-group">
            <label for="patientSelect">Медицинская история:</label>
            <select id="patientSelect" th:field="*{medHistoryId}">
                <option value="">Выберите мед историю</option>
            </select>
        </div>
        <div class="form-group">
            <label for="complaints">Жалобы пациента:</label>
            <textarea id="complaints" name="complaints" rows="4" required th:field="*{complaint}"></textarea>
        </div>
        <button type="submit">Добавить запись</button>
    </form>
</div>

<script>
    function formatPhoneNumber(phone) {
        const digits = phone.replace(/\D/g, '');
        const number = digits.slice(1);
        return `+7 (${number.slice(0, 3)}) ${number.slice(3, 6)}-${number.slice(6, 8)}-${number.slice(8, 10)}`;
    }

    let selectedPatient = null;

    function insertField(patient) {
        selectedPatient = patient;
        document.getElementById("name").value = patient.name;
        document.getElementById("phone").value = formatPhoneNumber(patient.telephoneNumber);
        document.getElementById("address").value = patient.address;
        document.getElementById("date_of_birth").value = patient.birthDate;
        getListMedHistory(patient);
    }

    async function getListMedHistory(patient) {
        try {
            const response = await fetch("/history/" + patient.id, { method: "GET" });
            if (response.ok) {
                const listOfMedHistories = await response.json();
                createSelect(listOfMedHistories);
            }
        } catch (e) {
            console.error("Error: ", e);
        }
    }

    function createSelect(listOfMedHistories) {
        let select = document.getElementById("patientSelect");
        select.innerHTML = '<option value="">Выберите мед историю</option>';
        listOfMedHistories.forEach(history => {
            let option = document.createElement("option");
            option.value = history.id;
            option.textContent = history.name;
            select.appendChild(option);
        });
    }

    function getPatients(x) {
        fetch("/patients/search?name=" + x)
            .then(response => {
                if (!response.ok) throw new Error("Ошибка сети или сервера");
                return response.json();
            })
            .then(data => {
                let datalist = document.getElementById("patients-list");
                datalist.innerHTML = "";
                data.forEach(patient => {
                    let option = document.createElement("option");
                    option.value = patient.name;
                    option.setAttribute("data-patient", JSON.stringify(patient));
                    datalist.appendChild(option);
                });
            })
            .catch(err => console.error(err));
    }

    function checkLengthName() {
        let x = document.getElementById("name").value;
        if (x.length > 0) {
            getPatients(x);
        } else {
            document.getElementById("patients-list").innerHTML = "";
        }
    }

    document.getElementById("name").addEventListener("input", function () {
        let input = this.value;
        let options = document.getElementById("patients-list").options;
        for (let option of options) {
            if (option.value === input) {
                let patient = JSON.parse(option.getAttribute("data-patient"));
                insertField(patient);
                break;
            }
        }
    });
</script>
</body>
</html>
