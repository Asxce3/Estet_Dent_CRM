<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Schedule</title>
    <link rel="stylesheet" href="/css/visits/visits.css">
    <link rel="stylesheet" href="/css/static_page_content/header.css">

</head>
<body>
<div class="app-container">
    <nav class="top-nav">
        <div class="nav-items">
            <a href="#" class="nav-item company-logo">
                <svg class="nav-icon dent-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-4-8c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1zm4 0c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1zm4 0c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1z"/>
                </svg>
                <span>DENT</span>
            </a>
            <a href="/visits" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                </svg>
                Расписание
            </a>
            <a href="/patients" class="nav-item ">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                Пациенты
            </a>
            <a href="#" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                Отчет
            </a>
            <a href="/materials" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                Материалы
            </a>
        </div>
        <div class="nav-profile">
            <span>Doctor</span>
            <button class="profile-btn">👤</button>
        </div>
    </nav>
    <div class="container">
        <h1>Расписание</h1>
        <h2 th:text="${startDate} + ' - ' + ${endDate}"></h2>
        <div class="week-control">
            <a th:href="@{/visits(inputWeek=${startDate.minusDays(7)})}"><button id="prevWeekBtn">&lt; Предыдущая неделя</button></a>
            <a th:href="@{/visits(inputWeek=${startDate.plusDays(7)})}"><button id="nextWeekBtn">Следующая неделя &gt;</button></a>
        </div>
        <div class="schedule-grid">

            <div class="day-header">ПН <span id="MONDAY"></span></div>
            <div class="day-header">ВТ <span id="TUESDAY"></span></div>
            <div class="day-header">СР <span id="WEDNESDAY"></span></div>
            <div class="day-header">ЧТ <span id="THURSDAY"></span></div>
            <div class="day-header">ПТ <span id="FRIDAY"></span></div>
            <div class="day-header">СБ <span id="SATURDAY"></span></div>
            <div class="day-header">ВС <span id="SUNDAY"></span></div>

            <div class="visit_container" th:each="day : ${daysOfWeek}">
                <div class="visit" th:id="${visit.getID()}" th:each="visit : ${visits}" th:if="${day == visit.dateOfVisit.getDayOfWeek()}">
                    <p th:text="${visit.patient.name}"></p>
                    <p th:text="${visit.complaint}"></p>
                    <p th:text="${visit.startVisit} + ' - ' + ${visit.finishVisit}"></p>
                </div>
            </div>
        </div>

        <a th:href="@{/visits/create}"><button id="addVisitBtn">Добавить визит</button></a>
        <div id = "manipulate-btn"  class="manipulate-btn">
            <button id="editVisitBtn">Изменить визит</button>
            <button id="deleteVisitBtn">Удалить визит</button>
        </div>
    </div>
</div>


<script>
    document.querySelectorAll(".visit").forEach(item => {
        item.addEventListener("click", (event) => {
            let manipulateButtons = document.getElementById("manipulate-btn")
            manipulateButtons.style.display = "block";
            let id = item.id

            let deleteVisitBtn = document.getElementById("deleteVisitBtn");
            deleteVisitBtn.addEventListener("click", () => {
                fetch('/visits/delete/' + id, {
                    method: "GET",
                }).then(() => {
                    window.location.href = "/visits";
                })
            })

            let editVisitBtn = document.getElementById("editVisitBtn");
            editVisitBtn.addEventListener("click", () => {
                window.location.href = "/visits/update/" + id;
            })
        })
    })

</script>
</body>
</html>
